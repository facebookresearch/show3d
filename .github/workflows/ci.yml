name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The headless OpenCV build needs no display libraries on the runner.
      - run: pip install numpy opencv-python-headless matplotlib
      - run: python -m unittest discover -v
